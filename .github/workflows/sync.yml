name: sync-qiangmu

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch remote txt
        run: |
          curl -fsSLk "${{ secrets.SRC_URL }}" -o qiangmu.txt

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qiangmu.txt
          git diff --staged --quiet && exit 0
          git commit -m "sync qiangmu.txt $(date -u +%F_%T)"
          git push
